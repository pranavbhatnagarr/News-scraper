# Australian news sources.
#
# Every feed in this file was verified to return parseable RSS/Atom items.
# Re-check any time with:  python -m newsau verify-feeds
#
# topic_hint is where the feed *lives* on the publisher's site. It is a prior,
# not the answer — the classifier decides the real topic per article, because
# a Guardian "technology" story is often really business or politics.
#
# Deliberately excluded (checked, return HTML not RSS as of the last audit):
#   news.com.au /content-feeds/*, 9news.com.au/rss,
#   foxsports.com.au /content-feeds/*, gizmodo.com.au/feed
#   michaelwest.com.au/feed (403s bots)

defaults:
  max_items_per_poll: 40

sources:
  # ---------- National / general ----------
  - name: abc-top-stories
    publisher: ABC News
    url: https://www.abc.net.au/news/feed/45910/rss.xml
    topic_hint: general

  - name: abc-just-in
